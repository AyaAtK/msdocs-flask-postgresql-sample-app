<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de Imágenes - Cloud</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f4f4;
    }
    h1 {
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #007acc;
      color: white;
    }
    tr:hover {
      background-color: #f1f1f1;
    }
    #filtro {
      margin-bottom: 15px;
      padding: 8px;
      width: 50%;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>Visor de Resultados de Imágenes Procesadas</h1>
  <input type="text" id="filtro" placeholder="Filtrar por nombre o usuario..." onkeyup="filtrarTabla()">

  <table id="tablaResultados">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Usuario</th>
        <th>Fecha</th>
        <th>Colores</th>
      </tr>
    </thead>
    <tbody id="contenidoTabla">
      <!-- Los datos serán insertados aquí mediante JavaScript -->
    </tbody>
  </table>

  <script>
    async function cargarDatos() {
      try {
        const response = await fetch('/api/imagenes'); // Ajusta esta ruta a tu endpoint real
        const datos = await response.json();
        const tabla = document.getElementById("contenidoTabla");

        datos.forEach(item => {
          const fila = document.createElement("tr");
          fila.innerHTML = `
            <td>${item.nombre}</td>
            <td>${item.usuario}</td>
            <td>${item.fecha}</td>
            <td>${JSON.stringify(item.colores)}</td>
          `;
          tabla.appendChild(fila);
        });
      } catch (error) {
        console.error("Error al cargar los datos:", error);
      }
    }

    function filtrarTabla() {
      const filtro = document.getElementById("filtro").value.toLowerCase();
      const filas = document.querySelectorAll("#contenidoTabla tr");

      filas.forEach(fila => {
        const textoFila = fila.textContent.toLowerCase();
        fila.style.display = textoFila.includes(filtro) ? "" : "none";
      });
    }

    cargarDatos();
  </script>
</body>
</html>
