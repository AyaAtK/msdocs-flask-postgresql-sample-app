<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Imágenes Registradas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4">Imágenes Registradas</h1>

        {% if imagenes %}
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Archivo</th>
                    <th>Fecha</th>
                    <th>Pixels</th>
                </tr>
            </thead>
            <tbody>
                {% for imagen in imagenes %}
                <tr>
                    <td>{{ imagen.id }}</td>
                    <td>{{ imagen.usuario }}</td>
                    <td>{{ imagen.filename }}</td>
                    <td>{{ imagen.fecha.strftime('%Y-%m-%d %H:%M:%S') }}</td>
                    <td>{{ imagen.pixels }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
            <div class="alert alert-info">No hay imágenes registradas.</div>
        {% endif %}
    </div>
</body>
</html>
